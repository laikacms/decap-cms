# pnpm workspace with a single (for now) self-named package: the published
# `@laikacms/decap-cms` package lives in packages/decap-cms. The `packages/`
# folder exists so sibling packages can be added later without another
# restructure - same layout as the laikacms/laikacms repo. See RESTRUCTURE.md.
packages:
  - 'packages/*'

catalogs:
  # TypeScript type definitions
  types:
    '@types/node': '^25.9.5'
    '@types/hast': '^3.0.5'
    '@types/mdast': '^4.0.4'
    '@types/lodash-es': '^4.17.12'
    '@types/unist': '^3.0.3'
    '@types/redux-mock-store': '^1.5.0'
    '@types/react': '^19.2.14'
    '@types/react-dom': '^19.2.3'
    '@types/tinycolor2': '^1.4.6'

  # Vite build tooling
  vite:
    'vite': '^8.0.3'
    '@vitejs/plugin-react': '^6.0.1'

  # Vitest testing
  vitest:
    'vitest': '^4.1.2'
    '@vitest/coverage-v8': '^4.1.10'
    'jsdom': '^29.1.1'
    '@testing-library/dom': '^10.4.1'
    '@testing-library/jest-dom': '^6.9.1'
    '@testing-library/react': '^16.3.2'
    '@testing-library/user-event': '^14.6.1'
    'redux-mock-store': '^1.5.5'
    'nock': '^14.0.13'

  # Emotion CSS-in-JS
  emotion:
    '@emotion/is-prop-valid': '^1.4.0'
    '@emotion/eslint-plugin': '^11.12.0'
    '@emotion/react': '^11.14.0'
    '@emotion/styled': '^11.14.1'

  # ESLint code linting
  eslint:
    '@eslint/js': '^10.0.1'
    'typescript-eslint': '^8.64.0'
    'eslint': '^10.7.0'
    'eslint-config-prettier': '^10.1.8'
    'eslint-import-resolver-typescript': '^4.4.5'
    'eslint-plugin-cypress': '^6.3.1'
    'eslint-plugin-import-x': '^4.17.1'
    'eslint-plugin-react': '^7.37.5'
    'eslint-plugin-react-hooks': '^7.1.1'
    'eslint-plugin-unicorn': '^58.0.0'

  # Storybook UI development
  storybook:
    '@storybook/addon-a11y': '^10.5.0'
    '@storybook/react': '^10.5.0'
    '@storybook/react-vite': '^10.5.0'
    'storybook': '^10.5.0'

  # Git/GitHub integrations
  git:
    '@octokit/rest': '^22.0.1'
    '@octokit/types': '^16.0.0'
    'simple-git': '^3.33.0'

  # Commitlint git commit linting
  commitlint:
    '@commitlint/cli': '^20.5.0'
    '@commitlint/config-conventional': '^20.5.0'

  # React framework and ecosystem
  react:
    'react': '^19.2.7'
    'react-dom': '^19.2.7'
    'react-redux': '^9.3.0'
    'react-router-dom': '^7.18.1'
    'react-dnd': '^16.0.1'
    'react-dnd-html5-backend': '^16.0.1'
    'react-frame-component': '^5.3.2'
    'react-split-pane': '^3.2.0'
    'react-topbar-progress-indicator': '^4.1.1'
    'react-waypoint': '^10.3.0'
    'react-window': '^2.2.7'
    'react-select': '^5.10.2'
    'react-colorful': '^5.8.0'
    'react-textarea-autosize': '^8.5.9'
    'tinycolor2': '^1.6.0'

  # Redux state management
  redux:
    '@reduxjs/toolkit': '^2.12.0'
    'redux': '^5.0.1'
    '@redux-devtools/extension': '^4.0.0'
    'redux-thunk': '^3.1.0'
    'immer': '^11.1.15'

  # Playwright E2E testing
  playwright:
    '@playwright/test': '^1.61.1'

  # Build and development tools
  build:
    'esbuild': '^0.27.7'
    'globals': '^17.7.0'
    'dotenv': '^17.4.2'
    'dprint': '^0.54.0'
    'husky': '^9.1.7'
    'prettier': '^3.8.1'
    'rimraf': '^6.1.3'
    'typescript': '^6.0.3'
    'tsc-alias': '^1.9.1'

  # Schema validation
  validation:
    'zod': '^4.4.3'

  # Utility libraries
  utils:
    'lodash-es': '^4.18.1'
    'unist-util-visit': '^5.1.0'
    'yaml': '^2.9.0'
    'smol-toml': '^1.7.0'
    'uuid': '^13.0.2'
    'dayjs': '^1.11.21'
    'fuzzy': '^0.1.3'
    'ini': '^6.0.0'
    'minimatch': '^10.2.5'

  # GraphQL and Apollo
  graphql:
    'graphql': '^16.14.2'
    'graphql-tag': '^2.12.7'
    'apollo-cache-inmemory': '^1.6.6'
    'apollo-client': '^2.6.10'
    'apollo-link-context': '^1.0.20'
    'apollo-link-http': '^1.5.17'

  # Authentication
  auth:
    'jwt-decode': '^4.0.0'

  # Markdown/Rich text processing (frontmatter parsing only — the WYSIWYG
  # editor stack was removed alongside widget-markdown and widget-richtext).
  markdown:
    'remark-parse': '^11.0.0'
    'remark-stringify': '^11.0.0'
    'remark-frontmatter': '^5.0.0'
    'unified': '^11.0.5'
    'vfile': '^6.0.3'
    'mdast-util-to-string': '^4.0.0'
    'mdast-util-from-markdown': '^2.0.3'
    # MDX format pack (src/format-packs/mdx): micromark syntax extensions +
    # mdast utilities; no acorn, expressions stay opaque (FORMAT_PACKS_PLAN.md
    # Phase 7).
    'micromark-extension-mdx-jsx': '^3.0.2'
    'micromark-extension-mdx-expression': '^3.0.1'
    'micromark-extension-mdx-md': '^2.0.0'
    'micromark-extension-gfm': '^3.0.0'
    'mdast-util-mdx-jsx': '^3.2.0'
    'mdast-util-mdx-expression': '^2.0.1'
    'mdast-util-gfm': '^3.1.0'

  # Code editor (CodeMirror 6, official packages only; the code widget wires
  # them together via its own local React wrapper).
  codemirror:
    '@codemirror/autocomplete': '^6.20.3'
    '@codemirror/commands': '^6.10.4'
    '@codemirror/language': '^6.12.4'
    '@codemirror/language-data': '^6.5.2'
    '@codemirror/lint': '^6.9.7'
    '@codemirror/search': '^6.7.1'
    '@codemirror/state': '^6.7.1'
    '@codemirror/view': '^6.43.6'
    '@lezer/highlight': '^1.2.3'
    '@replit/codemirror-emacs': '^6.1.0'
    '@replit/codemirror-vscode-keymap': '^6.0.2'
    '@replit/codemirror-vim': '^6.3.0'

  # Media libraries
  media:
    'uploadcare-widget': '^3.24.0'
    'uploadcare-widget-tab-effects': '^1.7.2'
    'ol': '^6.15.1'

  # Dev-server dependencies
  server:
    'winston': '^3.19.0'

  # Stega encoding
  stega:
    '@vercel/stega': '^1.1.0'

  # Lexical editor
  lexical:
    'lexical': '^0.48.0'
    '@lexical/code': '^0.48.0'
    '@lexical/code-prism': '^0.48.0'
    '@lexical/extension': '^0.48.0'
    '@lexical/file': '^0.48.0'
    '@lexical/hashtag': '^0.48.0'
    '@lexical/headless': '^0.48.0'
    '@lexical/history': '^0.48.0'
    '@lexical/link': '^0.48.0'
    '@lexical/list': '^0.48.0'
    '@lexical/markdown': '^0.48.0'
    '@lexical/overflow': '^0.48.0'
    '@lexical/react': '^0.48.0'
    '@lexical/rich-text': '^0.48.0'
    '@lexical/selection': '^0.48.0'
    '@lexical/table': '^0.48.0'
    '@lexical/text': '^0.48.0'
    '@lexical/utils': '^0.48.0'

  # Editor UI primitives (the Lexical widget's toolbar/menus).
  editor-ui:
    '@base-ui/react': '^1.6.0'

  # Portable Text editor stack (the `richtext` widget — replaces the dropped
  # widget-markdown; backs the rich-text editor via Sanity's PT editor).
  portabletext:
    '@portabletext/markdown': '^1.4.4'
    '@portabletext/react': '^6.2.0'
    '@portabletext/types': '^4.0.2'
    '@portabletext/html': '^1.1.1'
    '@portabletext/to-html': '^5.0.2'

  # Icons (lucide-react — richtext widget toolbar).
  icons:
    'lucide-react': '^1.25.0'
