# pnpm workspace with a single (for now) self-named package: the published
# `@laikacms/decap-cms` package lives in packages/decap-cms. The `packages/`
# folder exists so sibling packages can be added later without another
# restructure - same layout as the laikacms/laikacms repo. See restructure.md.
packages:
  - 'packages/*'

overrides:
  jsdom: "^29.1.1"
  stylus: "-"

# Single source of truth for dependency versions: every dependencies/
# devDependencies entry in the workspace resolves via "catalog:".
# peerDependencies stay literal in packages/decap-cms/package.json - they are
# consumer-facing compatibility ranges, not install pins.
