# Single-package layout: the `packages:` list is intentionally empty —
# this file is kept only so the `catalog:` protocol below keeps resolving.
# See RESTRUCTURE.md.
packages: []

catalogs:
  # TypeScript type definitions
  types:
    '@types/node': '^24.12.2'
    '@types/jwt-decode': '^3.1.0'
    '@types/lodash': '^4.17.24'
    '@types/uuid': '^11.0.0'
    '@types/unist': '^3.0.3'
    '@types/history': '^5.0.0'
    '@types/redux-mock-store': '^1.5.0'
    '@types/cors': '^2.8.19'
    '@types/express': '^5.0.6'
    '@types/morgan': '^1.9.10'
    '@types/vfile-message': '^2.0.0'
    '@types/common-tags': '^1.8.4'
    '@types/react': '^19.2.14'
    '@types/react-dom': '^19.2.3'
    '@types/prop-types': '^15.7.15'
    '@types/tinycolor2': '^1.4.6'
    '@types/react-redux': '^7.1.34'
    '@types/react-modal': '^3.16.3'
    '@types/react-is': '^19.0.0'

  # Vite build tooling
  vite:
    'vite': '^8.0.3'
    '@vitejs/plugin-react': '^6.0.1'
    'vite-plugin-dts': '^4.5.4'

  # Vitest testing
  vitest:
    'vitest': '^4.1.2'
    '@vitest/coverage-v8': '^4.1.2'
    'jsdom': '^29.0.1'
    '@testing-library/dom': '^10.4.1'
    '@testing-library/jest-dom': '^6.9.1'
    '@testing-library/react': '^16.3.2'
    '@testing-library/user-event': '^14.6.1'
    'redux-mock-store': '^1.5.5'
    'commonmark': '^0.31.2'
    'commonmark-spec': '^0.31.2'

  # Emotion CSS-in-JS
  emotion:
    '@emotion/babel-plugin': '^11.13.5'
    '@emotion/css': '^11.13.5'
    '@emotion/eslint-plugin': '^11.12.0'
    '@emotion/react': '^11.14.0'
    '@emotion/styled': '^11.14.1'

  # ESLint code linting
  eslint:
    '@eslint/js': '^10.0.1'
    'typescript-eslint': '^8.32.1'
    'eslint': '^10.2.1'
    'eslint-config-prettier': '^10.1.8'
    'eslint-import-resolver-exports': '^1.0.0-beta.5'
    'eslint-import-resolver-typescript': '^4.4.4'
    'eslint-plugin-cypress': '^6.3.1'
    'eslint-plugin-import-x': '^4.16.2'
    'eslint-plugin-react': '^7.37.5'
    'eslint-plugin-react-hooks': '^7.1.1'
    'eslint-plugin-unicorn': '^58.0.0'

  # Stylelint CSS linting
  stylelint:
    '@stylelint/postcss-css-in-js': '^0.38.0'
    'stylelint': '^17.6.0'
    'stylelint-config-standard-scss': '^17.0.0'

  # PostCSS processing
  postcss:
    'postcss': '^8.5.12'
    'postcss-scss': '^4.0.9'
    'postcss-styled-syntax': '^0.7.1'

  # Cypress E2E testing
  cypress:
    '@simonsmith/cypress-image-snapshot': '^10.0.3'
    'cypress': '^15.14.1'
    'cypress-plugin-tab': '^2.0.0'
    'nock': '^14.0.13'
    'mockserver-client': '^5.15.0'
    'mockserver-node': '^5.15.0'

  # Storybook UI development
  storybook:
    '@storybook/addon-actions': '^9.0.8'
    '@storybook/addon-links': '^10.3.4'
    '@storybook/react': '^10.3.4'

  # Git/GitHub integrations
  git:
    '@octokit/rest': '^22.0.1'
    '@octokit/types': '^16.0.0'
    'gitlab': '^14.2.2'
    'simple-git': '^3.33.0'

  # Commitlint git commit linting
  commitlint:
    '@commitlint/cli': '^20.5.0'
    '@commitlint/config-conventional': '^20.5.0'

  # React framework and ecosystem
  react:
    'react': '^19.2.4'
    'react-dom': '^19.2.4'
    'react-redux': '^9.2.0'
    'react-router-dom': '^7.14.0'
    'react-is': '19.2.4'
    'react-dnd': '^16.0.1'
    'react-dnd-html5-backend': '^16.0.1'
    'react-frame-component': '^5.3.2'
    'react-markdown': '^10.1.0'
    'react-modal': '^3.16.3'
    'react-polyglot': '^0.7.2'
    'react-scroll-sync': '^1.0.2'
    'react-split-pane': '^3.2.0'
    'react-toastify': '^11.0.5'
    'react-topbar-progress-indicator': '^4.1.1'
    'react-virtualized-auto-sizer': '^2.0.3'
    'react-waypoint': '^10.3.0'
    'react-window': '^2.2.7'
    'react-aria-menubutton': '^8.0.0'
    'react-transition-group': '^4.4.5'
    'react-select': '^5.10.2'
    'react-colorful': '^5.8.0'
    'react-textarea-autosize': '^8.5.9'
    'prop-types': '^15.8.1'
    'tinycolor2': '^1.6.0'

  # Redux state management
  redux:
    '@reduxjs/toolkit': '^2.11.2'
    'redux': '^5.0.1'
    'redux-devtools-extension': '^2.13.9'
    'redux-notifications': '^4.0.1'
    'redux-thunk': '^3.1.0'
    'immer': '^11.1.4'

  # Build and development tools
  build:
    'globals': '^17.5.0'
    'cross-env': '^10.1.0'
    'dotenv': '^17.4.0'
    'execa': '^9.6.1'
    'globby': '^16.2.0'
    'husky': '^9.1.7'
    'ncp': '^2.0.0'
    'npm-run-all': '^4.1.5'
    'turbo': '^2.5.4'
    'prettier': '^3.8.1'
    'rimraf': '^6.1.3'
    'typescript': '^6.0.2'
    'tsc-alias': '^1.8.16'
    'http-server': '^14.1.1'
    'start-server-and-test': '^3.0.0'
    'all-contributors-cli': '^6.26.1'
    'nodemon': '^3.1.14'
    'ts-node': '^10.9.2'

  # Schema validation
  validation:
    'ajv': '^8.18.0'
    'ajv-errors': '^3.0.0'
    'ajv-keywords': '^5.1.0'
    'zod': '^4.4.3'

  # Utility libraries
  utils:
    'lodash': '^4.18.1'
    'node-fetch': '^3.3.2'
    'rehype': '^13.0.2'
    'unist-util-visit': '^5.1.0'
    'yaml': '^2.8.3'
    'smol-toml': '^1.6.1'
    'uuid': '^13.0.0'
    'dayjs': '^1.11.20'
    'deepmerge': '^4.3.1'
    'copy-text-to-clipboard': '^3.2.2'
    'what-input': '^5.2.12'
    'common-tags': '^1.8.2'
    'fuzzy': '^0.1.3'
    'async-mutex': '^0.5.0'
    'tinycolor2': '^1.6.0'
    'what-the-diff': '^0.6.0'
    'ini': '^6.0.0'
    'minimatch': '^10.2.5'

  # Browser polyfills
  polyfills:
    'buffer': '^6.0.3'
    'path-browserify': '^1.0.1'
    'process': '^0.11.10'
    'stream-browserify': '^3.0.0'

  # GraphQL and Apollo
  graphql:
    'graphql': '^16.13.2'
    'graphql-tag': '^2.12.6'
    'apollo-cache-inmemory': '^1.6.6'
    'apollo-client': '^2.6.10'
    'apollo-link-context': '^1.0.20'
    'apollo-link-http': '^1.5.17'

  # Authentication
  auth:
    'gotrue-js': '^1.0.1'
    'jwt-decode': '^4.0.0'

  # Markdown/Rich text processing (frontmatter parsing only — the WYSIWYG
  # editor stack was removed alongside widget-markdown and widget-richtext).
  markdown:
    'remark-gfm': '4.0.1'
    'remark-parse': '^11.0.0'
    'remark-stringify': '^11.0.0'
    'remark-frontmatter': '^5.0.0'
    'unified': '^11.0.5'
    'vfile': '^6.0.3'
    'mdast-util-to-string': '^4.0.0'
    'mdast-util-from-markdown': '^2.0.3'

  # Code editor (CodeMirror 5; the widget uses react-codemirror2 + classic
  # `codemirror/mode/*` loaders, which only exist in CodeMirror 5.x).
  codemirror:
    'codemirror': '^6.0.2'
    '@replit/codemirror-emacs': '^6.1.0'
    '@replit/codemirror-vscode-keymap': '^6.0.2'
    '@replit/codemirror-vim': '^6.3.0'
    '@uiw/react-codemirror': '^4.25.9'
    '@uiw/codemirror-extensions-langs': '^4.25.9'
    '@uiw/codemirror-theme-material': '^4.25.9'

  # Data formats
  formats:
    '@iarna/toml': '2.2.5'
    'tomlify-j0.4': '^3.0.0'
    'micromark-extension-frontmatter': '^2.0.0'
    'micromark': '^4.0.2'

  # History/routing
  routing:
    'history': '^5.3.0'
    'node-polyglot': '^2.6.0'

  # Media libraries
  media:
    'uploadcare-widget': '^3.23.4'
    'uploadcare-widget-tab-effects': '^1.7.2'
    'ol': '^6.9.0'

  # Server dependencies
  server:
    'express': '^5.2.1'
    'cors': '^2.8.6'
    'morgan': '^1.10.1'
    'winston': '^3.19.0'

  # Stega encoding
  stega:
    '@vercel/stega': '^1.1.0'

  # Lexical editor
  lexical:
    'lexical': '^0.42.0'
    '@lexical/code': '^0.42.0'
    '@lexical/code-prism': '^0.42.0'
    '@lexical/extension': '^0.42.0'
    '@lexical/file': '^0.42.0'
    '@lexical/hashtag': '^0.42.0'
    '@lexical/headless': '^0.42.0'
    '@lexical/history': '^0.42.0'
    '@lexical/link': '^0.42.0'
    '@lexical/list': '^0.42.0'
    '@lexical/markdown': '^0.42.0'
    '@lexical/overflow': '^0.42.0'
    '@lexical/react': '^0.42.0'
    '@lexical/rich-text': '^0.42.0'
    '@lexical/selection': '^0.42.0'
    '@lexical/table': '^0.42.0'
    '@lexical/text': '^0.42.0'
    '@lexical/utils': '^0.42.0'

  # Editor UI primitives (the Lexical widget's toolbar/menus).
  editor-ui:
    '@base-ui/react': '^1.6.0'
    'cmdk': '^1.1.1'

  # Portable Text editor stack (the `richtext` widget — replaces the dropped
  # widget-markdown; backs the rich-text editor via Sanity's PT editor).
  portabletext:
    '@portabletext/markdown': '^1.2.0'
    '@portabletext/react': '^6.2.0'
    '@portabletext/types': '^4.0.2'
    '@portabletext/html': '^1.1.0'
    '@portabletext/to-html': '^5.0.2'

  # Icons (lucide-react — richtext widget toolbar).
  icons:
    'lucide-react': '^1.7.0'
