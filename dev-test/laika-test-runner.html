<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Laika test runner</title>
  <style>
    body { font: 13px monospace; padding: 16px; }
    #results { white-space: pre; }
    #cms-pane { position: fixed; right: 0; top: 0; width: 60%; height: 100%; border-left: 1px solid #ccc; }
    .pass { color: green; }
    .fail { color: red; font-weight: bold; }
    .info { color: gray; }
  </style>
</head>
<body>
  <h2>Laika headless test runner</h2>
  <div id="results">Running…</div>
  <iframe id="cms-pane" src="about:blank"></iframe>

  <script>
    // Self-running test harness — drives a child iframe pointed at laika.html
    // (auth-seeded) and writes pass/fail lines to #results. Chrome's
    // --dump-dom captures the final DOM with all verdicts. The child does
    // the actual rendering; we drive it via the iframe contentWindow.

    const out = document.getElementById('results');
    const errors = [];
    const checks = [];
    const log = (cls, msg) => {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = msg;
      out.appendChild(div);
    };
    const pass = msg => { log('pass', '✓ ' + msg); checks.push({ pass: true, msg }); };
    const fail = msg => { log('fail', '✗ ' + msg); checks.push({ pass: false, msg }); };
    const info = msg => log('info', '  ' + msg);

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // Rendered text of `root`, excluding the source of any SCRIPT/STYLE
    // elements. `textContent` walks those nodes too, which makes it match
    // strings that only exist in embedded script/preview-template source —
    // never anything actually shown to a user. Use this instead of
    // `.textContent` whenever a test cares about what's visibly rendered.
    function getRenderedText(root, doc) {
      const ownerDoc = doc || root.ownerDocument || document;
      const walker = ownerDoc.createTreeWalker(
        root,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode(node) {
            const tag = node.parentElement?.closest('script, style');
            return tag ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
          },
        },
      );
      let text = '';
      let node;
      while ((node = walker.nextNode())) {
        text += node.nodeValue + ' ';
      }
      return text;
    }

    async function run() {
      // 1) Seed auth in our origin (the iframe inherits localStorage if same-origin)
      localStorage.setItem(
        'decap-cms-user',
        JSON.stringify({ backendName: 'test-repo', name: 'Alice', login: 'alice' }),
      );

      // 2) Capture iframe console + errors
      const iframe = document.getElementById('cms-pane');
      iframe.src = '/laika.html';
      // Wait for it to be ready
      await new Promise(r => iframe.addEventListener('load', r, { once: true }));
      // Hook the iframe's console + error events so we can detect runtime issues
      const iwin = iframe.contentWindow;
      const origErr = iwin.console.error;
      iwin.console.error = (...args) => {
        // React errors use printf-style %s placeholders that the browser
        // interpolates with the remaining args. Reproduce that here so
        // we capture the real prop names / component names.
        let msg;
        if (typeof args[0] === 'string') {
          let i = 1;
          msg = args[0].replace(/%[sodifc]/g, () => String(args[i++] ?? ''));
        } else {
          msg = args.map(a => (a?.message ?? String(a))).join(' ');
        }
        errors.push(msg.slice(0, 800));
        return origErr.apply(iwin.console, args);
      };
      iwin.addEventListener('error', e => errors.push('Uncaught: ' + (e.error?.message ?? e.message)));
      iwin.addEventListener('unhandledrejection', e => errors.push('UnhandledRejection: ' + (e.reason?.message ?? String(e.reason))));

      // Let the app initialize
      await sleep(4000);

      const idoc = iframe.contentDocument;

      // === Test 1: dashboard rendered with header + sidebar + footer ===
      const header = idoc.querySelector('header');
      const aside = idoc.querySelector('aside');
      const footer = idoc.querySelector('footer');
      header ? pass('header present')   : fail('header missing');
      aside  ? pass('aside present')    : fail('aside missing');
      footer ? pass('footer present')   : fail('footer missing');

      // === Test 2: page has exactly one h1 ===
      const h1s = idoc.querySelectorAll('h1');
      h1s.length === 1 ? pass('single h1 on dashboard') : fail(`expected 1 h1, found ${h1s.length}`);
      info('h1 text: ' + (h1s[0]?.textContent ?? '(none)'));

      // === Test 3: sidebar has Folders + Files headings (not duplicate "Collections") ===
      const sectionHeadings = Array.from(idoc.querySelectorAll('aside h3')).map(h => h.textContent?.trim());
      const dupes = sectionHeadings.filter((t, i) => sectionHeadings.indexOf(t) !== i);
      dupes.length === 0
        ? pass('sidebar section headings are unique: ' + JSON.stringify(sectionHeadings))
        : fail('duplicate sidebar headings: ' + JSON.stringify(dupes));

      // === Test 4: active NavLink has React-Router's standard .active class ===
      const activeLinks = idoc.querySelectorAll('a.active, a[aria-current="page"]');
      activeLinks.length > 0
        ? pass(`found ${activeLinks.length} active link(s) at dashboard`)
        : fail('no active nav link at /');

      // === Test 5: no transient prop leaks anywhere in the DOM ===
      const html = idoc.documentElement.outerHTML;
      const leakAttrs = ['buttonSize=', 'buttonsize=', '$fullWidth', '$active=', '$size=', '$intent=', 'variant='];
      const leaks = leakAttrs.filter(a => html.includes(a));
      leaks.length === 0
        ? pass('no transient prop leaks')
        : fail('transient prop leaks: ' + leaks.join(', '));

      // === Test 6: no function-source leak in class attributes ===
      const fnLeak = /class="[^"]*isActive\s*\?\s*ACTIVE/.test(html);
      fnLeak ? fail('function-source leak in className') : pass('no function-source leak in className');

      // === Test 7: Cmd+K palette opens ===
      iwin.dispatchEvent(new iwin.KeyboardEvent('keydown', { key: 'k', metaKey: true }));
      await sleep(400);
      const dialog = idoc.querySelector('[role="dialog"]');
      dialog ? pass('Cmd+K opens a dialog') : fail('Cmd+K did not open dialog');
      if (dialog) {
        const items = dialog.querySelectorAll('[role="option"]');
        items.length > 0
          ? pass(`palette has ${items.length} items`)
          : fail('palette has 0 items');
        info('first 3 items: ' + Array.from(items).slice(0, 3).map(i => i.textContent?.trim().slice(0, 30)).join(' | '));
      }

      // === Test 8: --decap-color-background CSS variable is defined (theme works) ===
      const root = idoc.documentElement;
      const bgVar = iwin.getComputedStyle(root).getPropertyValue('--decap-color-background');
      bgVar
        ? pass('--decap-color-background CSS var is set: ' + bgVar.trim())
        : fail('--decap-color-background CSS var is missing');

      // === Test 8.5: 404 route renders LaikaNotFoundPage ===
      // Done early when iframe state is clean — late-stage navigation can
      // fail in --dump-dom after many state transitions.
      iwin.location.hash = '#/this-route-does-not-exist';
      await sleep(800);
      const has404 = !!Array.from(idoc.querySelectorAll('*'))
        .find(el => /^404$/.test(el.textContent?.trim() || ''));
      const nfH1 = idoc.querySelector('h1')?.textContent?.trim() || '';
      (has404 || /not found|404/i.test(nfH1))
        ? pass(`404 route renders LaikaNotFoundPage (h1="${nfH1}", 404 mark=${has404})`)
        : fail(`404 route does not render NotFound (h1="${nfH1}", 404 mark=${has404})`);

      // === Test 9: navigate to settings, find Match-system toggle ===
      iwin.location.hash = '#/settings';
      await sleep(800);
      const settingsH1 = idoc.querySelector('h1')?.textContent?.trim();
      settingsH1 === 'Settings' ? pass('navigated to Settings') : fail(`expected 'Settings' h1, got '${settingsH1}'`);
      const sysSwitch = idoc.querySelector('input[role="switch"]');
      sysSwitch ? pass('Match-system toggle present') : fail('Match-system toggle missing');

      // === Test 10: Light vs Dark theme changes the CSS var ===
      // The toggle defaults to ON (system mode) — resolved theme can be either
      // light or dark depending on the host OS pref. Compare Light vs Dark
      // explicitly so the assertion is robust to whatever 'system' resolves to.
      if (sysSwitch) {
        if (sysSwitch.checked) {
          sysSwitch.click();
          await sleep(400);
        }
        const lightBtn = Array.from(idoc.querySelectorAll('button')).find(b => /^Light$/.test((b.textContent ?? '').trim()));
        const darkBtn = Array.from(idoc.querySelectorAll('button')).find(b => /^Dark$/.test((b.textContent ?? '').trim()));
        if (lightBtn && darkBtn) {
          lightBtn.click();
          await sleep(300);
          const bgLight = iwin.getComputedStyle(root).getPropertyValue('--decap-color-background').trim();
          darkBtn.click();
          await sleep(300);
          const bgDark = iwin.getComputedStyle(root).getPropertyValue('--decap-color-background').trim();
          info('Light bg: ' + bgLight + ' / Dark bg: ' + bgDark);
          bgDark !== bgLight
            ? pass('theme CSS var differs between Light and Dark: ' + bgLight + ' vs ' + bgDark)
            : fail('theme CSS var same in Light vs Dark mode');
        } else {
          fail('Light or Dark button not visible after disabling Match-system');
        }
      }

      // === Test 11: Cmd+K palette filter ===
      // The palette from Test 7 may still be open — close first by pressing
      // Cmd+K once (it toggles), then re-open. If it was already closed,
      // pressing Cmd+K twice still leaves it closed; pressing once more opens.
      // Safe approach: check current state, then ensure it's open.
      let dialog2 = idoc.querySelector('[role="dialog"]');
      if (dialog2) {
        iwin.dispatchEvent(new iwin.KeyboardEvent('keydown', { key: 'k', metaKey: true }));
        await sleep(300);
      }
      iwin.dispatchEvent(new iwin.KeyboardEvent('keydown', { key: 'k', metaKey: true }));
      await sleep(400);
      dialog2 = idoc.querySelector('[role="dialog"]');
      dialog2 ? pass('palette re-opens after navigation') : fail('palette did not re-open');
      if (dialog2) {
        const paletteInput = dialog2.querySelector('input[type="search"]');
        if (paletteInput) {
          // Use React's native value setter so the controlled-input state updates
          const setter = Object.getOwnPropertyDescriptor(iwin.HTMLInputElement.prototype, 'value').set;
          setter.call(paletteInput, 'media');
          paletteInput.dispatchEvent(new iwin.Event('input', { bubbles: true }));
          await sleep(300);
          const filteredItems = Array.from(dialog2.querySelectorAll('[role="option"]'));
          const labels = filteredItems.map(el => el.textContent?.trim() ?? '');
          // Should at least include "Media library" plus the synthetic "Search all… for media" action
          const hasMedia = labels.some(l => /Media library/i.test(l));
          const hasSearchAction = labels.some(l => /Search all collections for "media"/i.test(l));
          hasMedia ? pass('palette filters to Media library') : fail('palette missing Media library when query="media"');
          hasSearchAction ? pass('palette surfaces "Search all" synthetic action') : fail('palette missing synthetic search action');
          info('filtered labels: ' + JSON.stringify(labels));
        } else {
          fail('palette has no search input');
        }
        // Close palette by clicking outside (or pressing Esc — but Esc is handled by react-modal which we can simulate)
        iwin.dispatchEvent(new iwin.KeyboardEvent('keydown', { key: 'k', metaKey: true }));
        await sleep(300);
      }

      // === Test 12: Quick add dropdown opens with collection items ===
      // Go back to dashboard so the header is showing with the Quick add button visible
      iwin.location.hash = '#/';
      await sleep(600);
      const quickAddBtn = Array.from(idoc.querySelectorAll('[role="button"], button')).find(el =>
        /^Quick add$/.test((el.textContent ?? '').trim()),
      );
      if (quickAddBtn) {
        pass('Quick add trigger present in header');
        quickAddBtn.click();
        await sleep(300);
        // Look for visible dropdown items — Dropdown opens a positioned list
        const dropdownItems = Array.from(idoc.querySelectorAll('[role="menuitem"], li[role]'));
        dropdownItems.length > 0
          ? pass(`Quick add dropdown shows ${dropdownItems.length} items`)
          : fail('Quick add dropdown opened but has no items');
        info('items: ' + JSON.stringify(dropdownItems.slice(0, 3).map(i => i.textContent?.trim().slice(0, 30))));
      } else {
        fail('Quick add trigger missing from header');
      }

      // === Test 13: theme toggle in header (sun/moon) ===
      const themeBtn = idoc.querySelector('button[aria-label*="dark mode" i], button[aria-label*="light mode" i]');
      themeBtn
        ? pass('header theme-toggle button present: ' + themeBtn.getAttribute('aria-label'))
        : fail('header theme-toggle button missing');

      // === Test 14: hamburger button present (mobile menu) ===
      const hamburger = idoc.querySelector('button[aria-label*="Open menu" i], button[aria-label*="Close menu" i]');
      hamburger ? pass('hamburger menu button present (mobile)') : fail('hamburger button missing');

      // === Test 14.3: browser back navigation restores prior route ===
      // We're on dashboard at this point. Navigate forward, then call
      // history.back() and verify we land back on dashboard.
      iwin.location.hash = '#/collections/posts';
      await sleep(800);
      const afterForward = iwin.location.hash;
      iwin.history.back();
      await sleep(800);
      const afterBack = iwin.location.hash;
      afterForward === '#/collections/posts' && afterBack === '#/'
        ? pass(`browser back navigates: ${afterForward} → ${afterBack}`)
        : fail(`browser back broken (forward=${afterForward}, back=${afterBack})`);

      // === Test 14.4: hamburger click toggles sidebar open state ===
      // Verify the state wiring between LaikaHeader's hamburger and
      // LaikaSidebar via LaikaShellContext. Use the data-mobile-open attribute
      // (set in LaikaSidebar.tsx) as the canonical signal. We don't test the
      // computed transform here — Chrome --dump-dom has rendering quirks
      // around mid-flight transitions that can report stale matrix values.
      if (hamburger) {
        const sidebarEl = idoc.querySelector('aside');
        const stateBefore = sidebarEl.getAttribute('data-mobile-open');
        hamburger.click();
        await sleep(400);
        const stateAfter = sidebarEl.getAttribute('data-mobile-open');
        stateAfter !== stateBefore && (stateAfter === 'true' || stateAfter === 'false')
          ? pass(`hamburger click toggles sidebar state: ${stateBefore} → ${stateAfter}`)
          : fail(`hamburger click didn't toggle sidebar state (${stateBefore} → ${stateAfter})`);
        // Close it back so subsequent tests start from closed
        if (stateAfter === 'true') {
          const closeBtn = idoc.querySelector('button[aria-label*="Close menu" i]');
          if (closeBtn) closeBtn.click();
          await sleep(250);
        }
      }

      // === Test 14.44: Escape key closes mobile drawer ===
      if (hamburger) {
        hamburger.click();
        await sleep(400);
        const aside1 = idoc.querySelector('aside');
        if (aside1?.getAttribute('data-mobile-open') === 'true') {
          // Escape on window — LaikaShellProvider attaches a global keydown listener
          iwin.dispatchEvent(new iwin.KeyboardEvent('keydown', {
            key: 'Escape', code: 'Escape', keyCode: 27, which: 27,
            bubbles: true, composed: true,
          }));
          await sleep(300);
          const stateAfter = idoc.querySelector('aside').getAttribute('data-mobile-open');
          stateAfter === 'false'
            ? pass('Escape closes the mobile sidebar drawer')
            : fail(`Escape didn't close drawer (state=${stateAfter})`);
        } else {
          info('drawer was not open before Escape test — skipped');
        }
      }

      // === Test 14.45: backdrop click closes mobile drawer ===
      if (hamburger) {
        // Open the drawer
        hamburger.click();
        await sleep(400);
        const sidebarEl2 = idoc.querySelector('aside');
        if (sidebarEl2?.getAttribute('data-mobile-open') === 'true') {
          // Find the backdrop overlay — LaikaSidebar renders it when open
          const backdrop = idoc.querySelector('aside ~ div[aria-hidden="true"], aside + div[aria-hidden="true"]')
            || Array.from(idoc.querySelectorAll('div[aria-hidden="true"]'))
              .find(d => {
                const r = d.getBoundingClientRect();
                return r.width > 200 && r.height > 200; // backdrop covers the page
              });
          if (backdrop) {
            backdrop.click();
            await sleep(400);
            const stateAfter = idoc.querySelector('aside').getAttribute('data-mobile-open');
            stateAfter === 'false'
              ? pass('backdrop click closes the mobile sidebar drawer')
              : fail(`backdrop click didn't close drawer (state=${stateAfter})`);
          } else {
            info('backdrop not findable — skipping backdrop-close test');
          }
        } else {
          info('drawer state did not flip to open before backdrop test — skipping');
        }
      }

      // === Test 14.46: clicking a sidebar nav link auto-closes drawer ===
      if (hamburger) {
        hamburger.click();
        await sleep(400);
        const sidebarEl3 = idoc.querySelector('aside');
        if (sidebarEl3?.getAttribute('data-mobile-open') === 'true') {
          // Find a sidebar nav link
          const navLink = idoc.querySelector('aside a[href*="#/collections/"]');
          if (navLink) {
            navLink.click();
            await sleep(600);
            const stateAfter = idoc.querySelector('aside').getAttribute('data-mobile-open');
            stateAfter === 'false'
              ? pass('sidebar nav link click auto-closes drawer')
              : fail(`nav link didn't close drawer (state=${stateAfter})`);
          } else {
            info('no sidebar nav link found — skipping auto-close test');
          }
        }
      }

      // === Test 14.47: Quick add dropdown toggles aria-expanded ===
      // Find the Quick add trigger (it lives in Actions, not NavList, so it
      // stays visible on mobile too).
      const qaTrigger = Array.from(idoc.querySelectorAll('[role="button"], button'))
        .find(b => /^Quick add$/.test((b.textContent || '').trim()));
      if (qaTrigger) {
        const expBefore = qaTrigger.getAttribute('aria-expanded');
        qaTrigger.click();
        await sleep(300);
        // Re-query — the trigger element may be re-rendered
        const qaTrigger2 = Array.from(idoc.querySelectorAll('[role="button"], button'))
          .find(b => /^Quick add$/.test((b.textContent || '').trim()));
        const expAfter = qaTrigger2?.getAttribute('aria-expanded');
        (expBefore === 'false' || expBefore === null) && expAfter === 'true'
          ? pass(`Quick add aria-expanded toggles: ${expBefore} → ${expAfter}`)
          : fail(`Quick add aria-expanded broken: ${expBefore} → ${expAfter}`);
        // Close it
        if (expAfter === 'true' && qaTrigger2) {
          qaTrigger2.click();
          await sleep(200);
        }
      } else {
        info('Quick add trigger not found for aria-expanded test');
      }

      // === Test 14.5: hamburger button toggles aria-label (open ↔ close) ===
      if (hamburger) {
        const before = hamburger.getAttribute('aria-label') || '';
        hamburger.click();
        await sleep(300);
        // Re-query — the same button may have been re-rendered with a new label
        const hamburger2 = idoc.querySelector('button[aria-label*="Open menu" i], button[aria-label*="Close menu" i]');
        const after = hamburger2?.getAttribute('aria-label') || '';
        before !== after && /open|close/i.test(before) && /open|close/i.test(after)
          ? pass(`hamburger toggles state: "${before}" → "${after}"`)
          : fail(`hamburger didn't toggle state ("${before}" → "${after}")`);
        // Close it back
        if (hamburger2) {
          hamburger2.click();
          await sleep(250);
        }
      }

      // === Test 15: SettingsDropdown trigger present ===
      const settingsDropdownTrigger = idoc.querySelector('[aria-label="Account options dropdown"]');
      settingsDropdownTrigger
        ? pass('SettingsDropdown (user menu) trigger present')
        : fail('SettingsDropdown trigger missing');

      // === Test 15.5: SettingsDropdown opens menu with items ===
      if (settingsDropdownTrigger) {
        settingsDropdownTrigger.click();
        await sleep(300);
        const userMenuItems = Array.from(idoc.querySelectorAll('[role="menuitem"]'));
        // Should at least include Logout and probably Settings
        const hasLogout = userMenuItems.some(i => /log.?out|sign.?out/i.test(i.textContent || ''));
        userMenuItems.length > 0 && hasLogout
          ? pass(`SettingsDropdown opens with ${userMenuItems.length} items (including Log out)`)
          : fail(`SettingsDropdown menu broken (items=${userMenuItems.length}, hasLogout=${hasLogout})`);
        // Close it by clicking the trigger again
        settingsDropdownTrigger.click();
        await sleep(200);
      }

      // === Test 16: Collection cards each have Browse + (maybe) Quick add ===
      const cards = idoc.querySelectorAll('article');
      info('dashboard article count: ' + cards.length);
      const browseLinks = idoc.querySelectorAll('a[href*="#/collections/"]');
      browseLinks.length > 0 ? pass(`${browseLinks.length} browse links present`) : fail('no browse links');

      // === Test 16.4: aria-current="page" on active nav link ===
      // Wai-aria pattern for marking the current page link — should be set
      // on the dashboard NavLink when we're at /.
      const ariaCurrent = idoc.querySelector('a[aria-current="page"]');
      ariaCurrent
        ? pass(`aria-current="page" set on active nav link (href=${ariaCurrent.getAttribute('href')})`)
        : fail('no aria-current="page" — screen readers can\'t identify current page');

      // === Test 16.45: <html lang> attribute is set ===
      // Screen readers use this to pick the right pronunciation dictionary.
      // It belongs on the host HTML shell, not in React; the dev-test page is
      // the reference for consumers.
      const htmlLang = idoc.documentElement.getAttribute('lang') || '';
      htmlLang.length >= 2
        ? pass(`<html lang="${htmlLang}"> is set`)
        : fail('<html> has no lang attribute — screen readers can\'t pick a pronunciation dictionary');

      // === Test 16.5: viewport meta + document title sanity ===
      const viewport = idoc.querySelector('meta[name="viewport"]');
      const vpContent = viewport?.getAttribute('content') || '';
      /width=device-width/i.test(vpContent) && /initial-scale/i.test(vpContent)
        ? pass(`viewport meta present: "${vpContent}"`)
        : fail(`viewport meta missing or malformed: "${vpContent}"`);
      const docTitle = idoc.title || '';
      docTitle.length > 0
        ? pass(`document.title set: "${docTitle}"`)
        : fail('document.title is empty');

      // === Test 16.6: file-based collection (Pages) navigates and renders ===
      // Pages is a `files`-typed collection in the test config — different code
      // path from folder-typed collections like Posts.
      iwin.location.hash = '#/collections/pages';
      await sleep(900);
      const pagesH1 = idoc.querySelector('h1')?.textContent?.trim() || '';
      /page/i.test(pagesH1)
        ? pass(`file-based collection "Pages" renders: "${pagesH1}"`)
        : fail(`Pages collection h1 unexpected: "${pagesH1}"`);

      // === Test 17: navigate to a collection — verify breadcrumb, sort/filter UI ===
      iwin.location.hash = '#/collections/posts';
      await sleep(1000);
      const breadcrumb = idoc.querySelector('a[href="#/"]'); // Dashboard link in LaikaCollectionTop
      breadcrumb ? pass('CollectionTop breadcrumb to Dashboard present') : fail('breadcrumb to Dashboard missing');
      const newEntryBtn = Array.from(idoc.querySelectorAll('a')).find(a =>
        /New /.test((a.textContent ?? '').trim()),
      );
      newEntryBtn ? pass('"New Post" button present in CollectionTop') : fail('"New X" button missing');
      info('newEntry href: ' + newEntryBtn?.getAttribute('href'));

      // === Test 17.8: aria-current set on the sidebar collection link ===
      // We're already on /collections/posts at this point. The sidebar's
      // "Posts" link should be marked as the current page.
      const sidebarPostsLink = idoc.querySelector('aside a[href*="#/collections/posts"]');
      const sbAriaCurrent = sidebarPostsLink?.getAttribute('aria-current');
      const sbHasActive = sidebarPostsLink?.classList.contains('active');
      (sbAriaCurrent === 'page' || sbHasActive)
        ? pass(`sidebar Posts link marked active (aria-current="${sbAriaCurrent}", .active=${sbHasActive})`)
        : fail(`sidebar Posts link not marked active on /collections/posts`);

      // === Test 18: Entry list cards ===
      const entryCards = idoc.querySelectorAll('a[href*="/collections/posts/entries/"]');
      entryCards.length >= 1
        ? pass(`${entryCards.length} entry cards rendered`)
        : fail('no entry cards rendered');

      // === Test 17.5: collection page has a sort/filter toolbar ===
      const toolbar = idoc.querySelector('[role="toolbar"]');
      toolbar
        ? pass(`collection page renders a toolbar (aria-label="${toolbar.getAttribute('aria-label')}")`)
        : fail('no [role="toolbar"] on collection page (sort/filter UI missing?)');

      // === Test 17.6: header is sticky on scroll ===
      const headerEl = idoc.querySelector('header');
      if (headerEl) {
        const pos = iwin.getComputedStyle(headerEl).position;
        pos === 'sticky' || pos === 'fixed'
          ? pass(`header has position: ${pos} (stays in view on scroll)`)
          : fail(`header position is "${pos}" — won't stay in view when scrolling`);
      }

      // === Test 17.7: no horizontal overflow on collection page ===
      // scrollWidth > clientWidth on documentElement signals a layout that
      // extends past the viewport, causing horizontal scroll on mobile.
      const docElem = idoc.documentElement;
      // Diagnose viewport state
      const mqMobile = iwin.matchMedia('(max-width: 900px)');
      info(`viewport diag: clientWidth=${docElem.clientWidth}, innerWidth=${iwin.innerWidth}, matchMedia(max-width:900)=${mqMobile.matches}`);
      const overflowX = docElem.scrollWidth - docElem.clientWidth;
      if (Math.abs(overflowX) <= 2) {

        await sleep(500);
        const afterHomeHash = iwin.location.hash;
        afterHomeHash === '#/' && beforeHomeHash !== afterHomeHash
          ? pass(`home link navigates back to dashboard: ${beforeHomeHash} → ${afterHomeHash}`)
          : fail(`home link didn't navigate (${beforeHomeHash} → ${afterHomeHash})`);
      } else {
        fail('home/brand link with aria-label="Home" not found');
      }

      // === Test 19.17: color contrast — primary button on background ===
      // Sanity check: the primary CTA must have enough contrast against page bg.
      // Spec: WCAG AA requires 4.5:1 for normal text, 3:1 for ≥18px / bold.
      iwin.location.hash = '#/';
      await sleep(800);
      function parseRgb(s) {
        const m = (s || '').match(/rgba?\(([^)]+)\)/);
        if (!m) return null;
        const parts = m[1].split(',').map(p => parseFloat(p.trim()));
        return parts.length >= 3 ? parts.slice(0, 3) : null;
      }
      function relLuminance([r, g, b]) {
        const f = c => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
      }
      function contrast(rgb1, rgb2) {
        const l1 = relLuminance(rgb1), l2 = relLuminance(rgb2);
        return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
      }
      const primaryBtn = Array.from(idoc.querySelectorAll('button, a'))
        .find(el => /^(Save|New|Browse|Quick add)/i.test((el.textContent || '').trim()) &&
                    iwin.getComputedStyle(el).backgroundColor !== 'rgba(0, 0, 0, 0)');
      if (primaryBtn) {
        const cs = iwin.getComputedStyle(primaryBtn);
        const fg = parseRgb(cs.color);
        const bg = parseRgb(cs.backgroundColor);
        if (fg && bg) {
          const ratio = contrast(fg, bg);
          ratio >= 4.5
            ? pass(`primary button contrast OK: ${ratio.toFixed(2)}:1 (text=${cs.color}, bg=${cs.backgroundColor})`)
            : fail(`primary button contrast too low: ${ratio.toFixed(2)}:1 (text=${cs.color}, bg=${cs.backgroundColor})`);
        } else {
          info(`could not parse colors (fg=${cs.color}, bg=${cs.backgroundColor})`);
        }
      } else {
        info('no primary CTA found to test contrast against');
      }

      // === Test 19.18: light mode primary button contrast (matches the dark check) ===
      // Set the persisted theme to light, navigate to a page with a primary CTA.
      iwin.localStorage.setItem('laika-cms-theme-mode', 'light');
      iwin.location.hash = '#/collections/posts';
      await sleep(900);
      // Find a primary button (New Post is the canonical CTA in CollectionTop)
      const lightPrimary = Array.from(idoc.querySelectorAll('a, button'))
        .find(el => /^New /.test((el.textContent || '').trim()) &&
                    iwin.getComputedStyle(el).backgroundColor !== 'rgba(0, 0, 0, 0)');
      if (lightPrimary) {
        const cs = iwin.getComputedStyle(lightPrimary);
        const fg = parseRgb(cs.color);
        const bg = parseRgb(cs.backgroundColor);
        if (fg && bg) {
          const ratio = contrast(fg, bg);
          ratio >= 4.5
            ? pass(`light primary contrast OK: ${ratio.toFixed(2)}:1 (text=${cs.color}, bg=${cs.backgroundColor})`)
            : fail(`light primary contrast too low: ${ratio.toFixed(2)}:1 (text=${cs.color}, bg=${cs.backgroundColor})`);
        } else {
          info(`could not parse light-mode colors (fg=${cs.color}, bg=${cs.backgroundColor})`);
        }
      } else {
        info('light-mode primary CTA not found');
      }

      // === Test 19.19: entry card images load (no broken/zero-sized images) ===
      // Switch to grid view to surface the cover images.
      const gridBtn = Array.from(idoc.querySelectorAll('button'))
        .find(b => /grid/i.test(b.getAttribute('aria-label') || '') ||
                   /grid/i.test(b.title || ''));
      if (gridBtn) {
        gridBtn.click();
        await sleep(700);
      }
      const imgs = Array.from(idoc.querySelectorAll('main img, [class*="EntryCard"] img, [class*="GridCard"] img'));
      // GridImage uses background-image, not <img>. Find divs with background-image set instead.
      const bgImageDivs = Array.from(idoc.querySelectorAll('main div'))
        .filter(d => {
          const bi = iwin.getComputedStyle(d).backgroundImage;
          return bi && bi !== 'none' && bi.includes('url(');
        });
      const imageCount = imgs.length + bgImageDivs.length;
      imageCount > 0
        ? pass(`entry list renders ${imgs.length} <img> + ${bgImageDivs.length} background-image divs`)
        : info('no image-rendering elements found in grid view (entries may not have covers)');

      // === Test 20: console error count ===
      // Filter pre-existing core warnings + Decap-CMS upstream bugs that
      // exist independently of laika (would also affect vanilla Decap).
      const preExistingCoreIssues = [
        /Selector unknown/, // pre-existing Redux selector anti-patterns in core
        /POP navigation/,   // test-runner artifact (we use location.hash directly)
        /Failed to load resource/, // 404 for assets in test env
        // Core ui-default's <DropdownItem> forwards `isActive` / `isCheckedItem`
        // to the underlying DOM. Affects vanilla Decap too. Out of scope for
        // laika since the fix would be in src/ui-default/Dropdown.tsx.
        /React does not recognize the `isActive` prop/,
        /React does not recognize the `isCheckedItem` prop/,
        // Pre-existing core anti-pattern: Editor dispatches during render,
        // causing AppContent to re-render mid-render. Affects vanilla Decap.
        /Cannot update a component .* while rendering a different component/,
      ];
      const realErrors = errors.filter(
        e => !preExistingCoreIssues.some(re => re.test(e)),
      );
      realErrors.length === 0
        ? pass('zero laika-related console errors')
        : fail(`${realErrors.length} laika-related console error(s)`);
      realErrors.slice(0, 5).forEach(e => info('  err: ' + e.slice(0, 200)));

      // Summary
      const passes = checks.filter(c => c.pass).length;
      const fails = checks.filter(c => !c.pass).length;
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.style.fontSize = '14px';
      summary.id = 'summary';
      summary.textContent = `RESULT: ${passes} passed, ${fails} failed`;
      out.appendChild(summary);
    }

    run().catch(e => {
      fail('Runner crashed: ' + (e?.message ?? String(e)));
      const summary = document.createElement('div');
      summary.id = 'summary';
      summary.textContent = 'RESULT: crashed';
      out.appendChild(summary);
    });
  </script>
</body>
</html>
