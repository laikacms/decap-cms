<!doctype html>
<html>
<head>
  <meta charset="utf-8" />

  <title>Decap CMS Development Test</title>
  <script src="repo-fixtures.js"></script>
</head>
<body>

  <script src="dist/decap-cms.js"></script>
  <script>
    var CMS = window.DecapCms.DecapCmsApp;
    var h = window.DecapCms.h;

    var PostPreview = function(props) {
      var entry = props.entry;
      return h('div', {},
        h('div', {className: "cover"},
          h('h1', {}, entry.data.title),
          props.widgetFor('image'),
        ),
        h('p', {},
          h('small', {}, "Written " + entry.data.date)
        ),
        h('h2', {}, "Richtext Widget"),
        h('div', {"className": "text"}, props.widgetFor('body'))
      );
    };

    var GeneralPreview = function(props) {
      var entry = props.entry;
      var title = entry.data.site_title;
      var posts = entry.data.posts;
      var thumb = posts && posts.thumb;

      return h('div', {},
        h('h1', {}, title),
        h('dl', {},
          h('dt', {}, 'Posts on Frontpage'),
          h('dd', {}, props.widgetsFor('posts').widgets.front_limit || 0),

          h('dt', {}, 'Default Author'),
          h('dd', {}, props.widgetsFor('posts').data.author || 'None'),

          h('dt', {}, 'Default Thumbnail'),
          h('dd', {}, thumb && h('img', {src: props.getAsset(thumb).toString()}))
        )
      );
    };

    var AuthorsPreview = function(props) {
      return h('div', {},
        h('h1', {}, 'Authors'),
        props.widgetsFor('authors').map(function(author, index) {
          return h('div', {key: index},
            h('hr', {}),
            h('strong', {}, author.data.name),
            author.widgets.description
          );
        })
      );
    };

    var RelationKitchenSinkPostPreview = function(props) {
      // When a post is selected from the relation field, all of it's data
      // will be available in the field's metadata nested under the collection
      // name, and then further nested under the value specified in `value_field`.
      // In this case, the post would be nested under "posts" and then under
      // the title of the selected post, since our `value_field` in the config
      // is "title".
      var value = props.value;
      var fieldsMetaData = props.fieldsMetaData;
      var post = fieldsMetaData && fieldsMetaData.posts && fieldsMetaData.posts[value];
      var style = { border: '2px solid #ccc', borderRadius: '8px', padding: '20px' };
      return post ? h('div', { style: style },
        h('h2', {}, 'Related Post'),
        h('h3', {}, post.title),
        h('img', { src: post.image }),
        h('p', {}, (post.body || '').slice(0, 100) + '...'),
      ) : null;
    };

    const previewStyles = `
      html,
      body {
        color: #444;
        font-size: 14px;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      body {
        padding: 20px;
      }

      h1 {
        margin-top: 20px;
        color: #666;
        font-weight: bold;
        font-size: 32px;
      }

      img {
        max-width: 100%;
      }
    `;

    CMS.registerPreviewTemplate("posts", PostPreview);
    CMS.registerPreviewTemplate("general", GeneralPreview);
    CMS.registerPreviewTemplate("authors", AuthorsPreview);
    CMS.registerPreviewStyle(previewStyles, { raw: true });
    // Pass the name of a registered control to reuse with a new widget preview.
    CMS.registerWidget({
      name: "relationKitchenSinkPost",
      controlComponent: CMS.getWidget("relation").control,
      previewComponent: RelationKitchenSinkPostPreview,
    });
    // PT-native custom blocks (CMS.registerBlock replaced the removed
    // registerEditorComponent API). `formats.markdown` codecs define how each
    // block round-trips through markdown source.
    CMS.registerBlock({
      id: 'youtube',
      label: 'Youtube',
      fields: [{ name: 'id', label: 'Youtube Video ID' }],
      defaultData: { id: '' },
      preview: function (props) {
        return h('img', {
          src: 'http://img.youtube.com/vi/' + props.data.id + '/maxresdefault.jpg',
          alt: 'Youtube Video',
        });
      },
      formats: {
        markdown: {
          pattern: /^{{<\s?youtube (\S+)\s?>}}/,
          fromMatch: function (match) {
            return { id: match[1] };
          },
          serialize: function (data) {
            return '{{< youtube ' + data.id + ' >}}';
          },
        },
      },
    });
    CMS.registerBlock({
      id: 'container-markdown',
      label: 'Container Markdown',
      fields: [
        { name: 'inner', label: 'Body', widget: 'richtext', blocks: [] },
      ],
      formats: {
        markdown: {
          pattern: /^{{< container-markdown >}}(.*?){{< \/container-markdown >}}/s,
          fromMatch(match) {
            return { inner: match[1] || '' };
          },
          serialize(data) {
            return `{{< container-markdown >}}${data.inner}{{< /container-markdown >}}`;
          },
        },
      },
    });
    CMS.registerBlock({
      id: 'container-richtext',
      label: 'Container Richtext',
      fields: [
        { name: 'inner', label: 'Body', widget: 'richtext', blocks: ['container-richtext'] },
      ],
      formats: {
        markdown: {
          pattern: /^{{< container-richtext >}}(.*?){{< \/container-richtext >}}/s,
          fromMatch(match) {
            return { inner: match[1] || '' };
          },
          serialize(data) {
            return `{{< container-richtext >}}${data.inner}{{< /container-richtext >}}`;
          },
        },
      },
    });

  </script>
</body>
</html>
