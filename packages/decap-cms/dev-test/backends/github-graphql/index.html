<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <title>Decap CMS Development Test</title>
  </head>
  <body>
    <script src="dist/decap-cms-graphql.js"></script>
    <script>
      var CMS = window.CMS;
      var h = window.h;

      var PostPreview = function(props) {
        var entry = props.entry;
        return h(
          'div',
          {},
          h('div', { className: 'cover' }, h('h1', {}, entry?.data?.title)),
          h('p', {}, h('small', {}, 'Written ' + entry?.data?.date)),
          h('div', { className: 'text' }, props.widgetFor('body')),
        );
      };

      var PagePreview = function(props) {
        var entry = props.entry;
        return h(
          'div',
          {},
          h('div', { className: 'cover' }, h('h1', {}, entry?.data?.title)),
          h('p', {}, h('small', {}, 'Written ' + entry?.data?.date)),
          h('div', { className: 'text' }, props.widgetFor('body')),
        );
      };

      CMS.registerPreviewTemplate('posts', PostPreview);
      CMS.registerPreviewTemplate('pages', PagePreview);
    </script>
  </body>
</html>
