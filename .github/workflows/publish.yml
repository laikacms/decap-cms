name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production # Optional: adds approval requirements and deployment protection
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Lint, typecheck, and unit tests
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

      # The published package lives in packages/decap-cms (workspace root is
      # private). npm publish picks up OIDC automatically via trusted
      # publishers, so no NODE_AUTH_TOKEN is needed.
      - name: Publish to npm
        working-directory: packages/decap-cms
        run: npm publish --provenance --access public
