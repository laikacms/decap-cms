name: Publish Packages

on:
  push:
    tags:
      - 'decap-*@*'

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishers

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production  # adds approval requirements and deployment protection
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:ci

      - name: Test package integrity
        run: pnpm run test:package-integrity

      - name: Publish to npm
        # OIDC trusted publishers handle auth; no NODE_AUTH_TOKEN needed.
        # `from-git` semantics: pnpm publishes packages whose version isn't on the
        # registry yet, skipping any private packages.
        run: pnpm publish -r --access public --no-git-checks
