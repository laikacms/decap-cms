name: Create release

on: create

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/decap-cms@')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          TAG_NAME: ${{ github.ref }}
        run: echo "pkg=${TAG_NAME#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ steps.tag.outputs.pkg }}
          body: |
            :scroll: [Changelog](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.pkg }}/CHANGELOG.md)
