name: Node CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
      - v4.beta
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]
        include:
          - os: ubuntu-latest
            node-version: 22.x
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'pnpm'
      - name: log versions
        run: node --version && pnpm --version
      - name: install dependencies (skip Cypress binary)
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: run lint + types + unit tests
        run: pnpm run test:ci

  # NOTE: the Cypress e2e job was dropped during the single-package restructure.
  # Its orchestration scripts (test:e2e:run-ci, test:package-integrity) were
  # removed along with the old workspace, so the job could no longer run. Restore
  # a pnpm-based e2e job once the cypress + mockserver run scripts are rebuilt for
  # the src/ layout.
